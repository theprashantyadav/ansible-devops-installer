---

- name: Update apt cache
  apt:
    update_cache: yes

#################################################
# NGINX
#################################################

- name: Ask for Nginx installation
  pause:
    prompt: "Do you want to install Nginx? (yes/no)"
  register: nginx_input

- include_tasks: nginx.yml
  when: nginx_input.user_input | lower == 'yes'

